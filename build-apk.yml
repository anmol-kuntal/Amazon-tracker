name: Build APK

# Builds a debug APK automatically every time you push to this repo.
# No Android Studio needed - GitHub's servers do the compiling.
# After it finishes: go to the Actions tab -> click the latest run ->
# scroll to "Artifacts" -> download "app-debug".

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
